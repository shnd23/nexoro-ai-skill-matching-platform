<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="1060" height="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Nexero architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1060" height="480" fill="#ffffff"/>

  <!-- Frontend -->
  <rect x="40" y="107" width="210" height="120" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="145" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Frontend</text>
  <text x="145" y="162" text-anchor="middle" font-size="12.5" fill="#333">Next.js 14</text>
  <text x="145" y="181" text-anchor="middle" font-size="12" fill="#666">TypeScript, Tailwind CSS</text>
  <text x="145" y="199" text-anchor="middle" font-size="12" fill="#666">Typed API client, Auth context</text>

  <!-- Backend container -->
  <rect x="330" y="40" width="340" height="400" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
  <text x="500" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#111">.NET 10 REST API</text>
  <text x="500" y="91" text-anchor="middle" font-size="12" fill="#666">Clean Architecture</text>

  <rect x="360" y="112" width="280" height="85" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="500" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Api</text>
  <text x="500" y="160" text-anchor="middle" font-size="12" fill="#666">Controllers, JWT, Google OAuth</text>
  <text x="500" y="178" text-anchor="middle" font-size="12" fill="#666">Swagger</text>

  <rect x="360" y="232" width="280" height="85" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="500" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Infrastructure</text>
  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#666">EF Core, Identity, Repositories</text>
  <text x="500" y="298" text-anchor="middle" font-size="12" fill="#666">HybridMatchingService</text>

  <rect x="360" y="352" width="280" height="68" rx="5" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text x="500" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Domain</text>
  <text x="500" y="400" text-anchor="middle" font-size="12" fill="#666">Entities, Interfaces, Records</text>

  <!-- internal dependency arrows -->
  <line x1="500" y1="197" x2="500" y2="230" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="500" y1="317" x2="500" y2="350" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ML service -->
  <rect x="810" y="90" width="210" height="125" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="915" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#111">ML Service</text>
  <text x="915" y="145" text-anchor="middle" font-size="12.5" fill="#333">Python FastAPI</text>
  <text x="915" y="164" text-anchor="middle" font-size="12" fill="#666">SBERT all-MiniLM-L6-v2</text>
  <text x="915" y="182" text-anchor="middle" font-size="12" fill="#666">384-dim, cosine similarity</text>

  <!-- Database (cylinder) -->
  <path d="M810,310 v90 a105,16 0 0 0 210,0 v-90" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="915" cy="310" rx="105" ry="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="915" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#111">PostgreSQL 16</text>
  <text x="915" y="373" text-anchor="middle" font-size="12" fill="#666">Users, GigRequests</text>
  <text x="915" y="390" text-anchor="middle" font-size="12" fill="#666">Skills, Matches</text>

  <!-- external arrows -->
  <line x1="250" y1="155" x2="360" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="145" text-anchor="middle" font-size="11" fill="#444">HTTP</text>
  <text x="290" y="172" text-anchor="middle" font-size="10" fill="#777">via rewrite</text>

  <path d="M640,275 H740 V152 H808" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="774" y="143" text-anchor="middle" font-size="11" fill="#444">POST /rank</text>

  <path d="M740,275 V355 H808" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="774" y="346" text-anchor="middle" font-size="11" fill="#444">SQL</text>
</svg>
